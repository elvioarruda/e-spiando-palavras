<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>e-Spiando Palavras</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Gere caça-palavras personalizados offline de alta qualidade com dicionário integrado" />
  </head>
  <body class="bg-slate-900 text-slate-100 selection:bg-indigo-500/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/service-worker.js")
            .then((reg) => console.log("[PWA Index] Service Worker registrado com sucesso!", reg.scope))
            .catch((err) => console.error("[PWA Index] Falha na ativação do SW:", err));
        });
      }
    </script>
  </body>
</html>
